    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bar   { transform-box: fill-box; transform-origin: left center; animation: grow 8s ease-in-out infinite; }
    .ci    { animation: pulse 4s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0) } 25%, 90% { transform: scaleX(1) } 100% { transform: scaleX(1) } }
    @keyframes pulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
