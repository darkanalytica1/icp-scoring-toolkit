<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d">
  <title id="t">Backtest: call coverage next to win rate</title>
  <desc id="d">For each of the nine tiers, the share of the tier that was ever called and the win rate among called accounts with a 95 percent Wilson interval. Tier C1 shows the highest point estimate, 30.8 percent, but from only 26 calls, and its interval spans 16.5 to 50 percent and overlaps tier A1.</desc>
