<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d">
  <title id="t">Fit and intent scoring pipeline</title>
  <desc id="d">Each account is banded, then scored for fit and for intent on separate paths that are never averaged. The two tiers combine into one of nine quadrant tiers, a contactability gate removes accounts that cannot be reached, and the survivors are built into daily call lists.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow  { stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    .never { animation: pulse 6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <rect width="1200" height="540" fill="#F5F7FA"/>
  <text x="40" y="52" class="mono" font-size="12" letter-spacing="1.2" fill="#6B7688">FIG. 1  ·  SCORING PIPELINE, APPLIED TO EVERY ACCOUNT IN THE UNIVERSE</text>
  <text x="40" y="94" class="display" font-size="26" font-weight="600" fill="#0E1726">Fit and intent are scored apart, then gated by contactability</text>

  <!-- flows -->
  <g fill="none" stroke="#3E5C76" stroke-width="1.75" class="flow">
    <path d="M180,290 H210"/>
    <path d="M380,290 H400 V200 H420"/>
    <path d="M380,290 H400 V380 H420"/>
    <path d="M630,200 H650 V290 H670"/>
    <path d="M630,380 H650 V290 H670"/>
    <path d="M830,290 H860"/>
    <path d="M1000,290 H1030"/>
  </g>

  <!-- account -->
  <rect x="40" y="230" width="140" height="120" rx="4" fill="#fff" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="56" y="262" class="mono" font-size="12" letter-spacing="1" fill="#6B7688">ACCOUNT</text>
  <text x="56" y="316" class="sans" font-size="14" fill="#0E1726">firmographics,</text>
  <text x="56" y="336" class="sans" font-size="14" fill="#0E1726">signals, contacts</text>

  <!-- banding -->
  <rect x="210" y="230" width="170" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
  <rect x="210" y="230" width="170" height="3" fill="#0B2545"/>
  <text x="226" y="262" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">01  BANDING</text>
  <text x="226" y="316" class="sans" font-size="14" fill="#0E1726">revenue, headcount</text>
  <text x="226" y="336" class="sans" font-size="14" fill="#0E1726">→ labelled bands</text>

  <!-- fit -->
  <rect x="420" y="150" width="210" height="100" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
  <rect x="420" y="150" width="210" height="3" fill="#0B2545"/>
  <text x="436" y="180" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">02a  FIT</text>
  <text x="436" y="222" class="sans" font-size="14" fill="#0E1726">size · industry · region</text>
  <text x="436" y="240" class="sans" font-size="13" fill="#3D4A5C">who they are; static, cacheable</text>

  <!-- intent -->
  <rect x="420" y="330" width="210" height="100" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
  <rect x="420" y="330" width="210" height="3" fill="#0B2545"/>
  <text x="436" y="360" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">02b  INTENT</text>
  <text x="436" y="402" class="sans" font-size="14" fill="#0E1726">hiring · funding · expansion</text>
  <text x="436" y="420" class="sans" font-size="13" fill="#3D4A5C">what is happening; decays</text>

  <!-- never averaged -->
  <g class="never">
    <line x1="525" y1="258" x2="525" y2="322" stroke="#8A6A1F" stroke-width="1.5" stroke-dasharray="3 4"/>
    <rect x="462" y="279" width="126" height="22" rx="3" fill="#F4EFE2"/>
    <text x="525" y="295" class="mono" font-size="12" fill="#8A6A1F" text-anchor="middle">NEVER AVERAGED</text>
  </g>

  <!-- tier -->
  <rect x="670" y="230" width="160" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
  <rect x="670" y="230" width="160" height="3" fill="#0B2545"/>
  <text x="686" y="262" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">03  TIER</text>
  <text x="686" y="316" class="sans" font-size="14" fill="#0E1726">fit A/B/C × intent</text>
  <text x="686" y="336" class="sans" font-size="14" fill="#0E1726">1/2/3 → A1 … C3</text>

  <!-- gate -->
  <rect x="860" y="230" width="140" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
  <rect x="860" y="230" width="140" height="3" fill="#0B2545"/>
  <text x="876" y="262" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">04  GATE</text>
  <text x="876" y="316" class="sans" font-size="14" fill="#0E1726">contactability</text>
  <text x="876" y="336" class="sans" font-size="14" fill="#0E1726">≥ 40 to call</text>
  <line x1="930" y1="350" x2="930" y2="398" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="866" y="418" class="mono" font-size="12" fill="#6B7688">below: fix the data first</text>

  <!-- call list -->
  <rect x="1030" y="230" width="130" height="120" rx="4" fill="#fff" stroke="#0B2545" stroke-width="1.5"/>
  <rect x="1030" y="230" width="130" height="3" fill="#0B2545"/>
  <text x="1046" y="262" class="mono" font-size="12" letter-spacing="1" fill="#0B2545">05  CALL LIST</text>
  <text x="1046" y="316" class="sans" font-size="14" fill="#0E1726">25 per rep/day</text>
  <text x="1046" y="336" class="sans" font-size="14" fill="#0E1726">tier mix, region</text>

  <line x1="40" y1="466" x2="1160" y2="466" stroke="#D8DEE6"/>
  <text x="40" y="496" class="mono" font-size="12" fill="#6B7688">Thresholds from config/icp_example.json: fit A ≥ 82, B ≥ 58 · intent 1 ≥ 25, 2 ≥ 8 · intent half-life 45 days · contactability floor 40</text>

  <!-- travelling accounts -->
  <circle r="6" fill="#0B2545" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="7s" repeatCount="indefinite" path="M180,290 H400 V200 H650 V290 H1030"/>
  </circle>
  <circle r="6" fill="#3E5C76" stroke="#fff" stroke-width="1.5">
    <animateMotion dur="7s" repeatCount="indefinite" path="M180,290 H400 V380 H650 V290 H1030"/>
  </circle>
</svg>
